[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidet"
version = "0.1.0"
description = "Clean-room NVIDIA-first small-object detector for UAV and surveillance scenes."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "scipy>=1.12",
  "pillow>=10.0",
  "onnx>=1.16",
  "datasets>=2.20",
  "timm>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
evaluation = ["pycocotools>=2.0.8"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
