# Train OmniDet v0 with a frozen ConvNeXt v2 Tiny FCMAE backbone.
# This is the MAE-style pretrained option (Fully-Convolutional Masked
# Autoencoder pretraining, then ImageNet-1k fine-tuning). Checkpoint: CC-BY-NC-4.0;
# timm's Apache-2.0 code license is separate from checkpoint and data rights.
#
# Run:
#   PYTHONPATH=src python scripts/train_visdrone.py --config configs/v0_convnextv2_tiny_fcmae.yaml

# --- Model / backbone ---
backbone_preset: convnextv2_tiny_fcmae
backbone_pretrained: true
freeze_backbone: true
tasks: [detection]

# --- Training ---
hardware_profile: rtx5090_32g
epochs: 50
batch_size: 16
lr: 2e-4
lr_scheduler: cosine
lr_warmup_steps: 500
lr_min: 1e-6
grad_clip: 1.0
compile: true
augment: true
num_workers: 12
prefetch_factor: 4
precision: bf16

# --- Data ---
dataset: visdrone
images: /data/omnidet_datasets/visdrone_hf/train/images
annotations: /data/omnidet_datasets/visdrone_hf/train/annotations
val_images: /data/omnidet_datasets/visdrone_hf/val/images
val_annotations: /data/omnidet_datasets/visdrone_hf/val/annotations

# --- Output ---
log_csv: logs/v0_convnextv2_tiny_fcmae.csv
out: checkpoints/omnidet_v0_convnextv2_tiny_fcmae.pt
