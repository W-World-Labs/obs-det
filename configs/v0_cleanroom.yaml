# Reproduce the production v0 baseline (clean-room small backbone, all three
# applied: Mosaic+Copy-Paste, DN-queries, 150-epoch cosine).
#
# Run:
#   PYTHONPATH=src python scripts/train_visdrone.py --config configs/v0_cleanroom.yaml

# --- Model / backbone (clean-room default — no preset needed) ---
tasks: [detection]

# --- Training ---
hardware_profile: rtx5090_32g
epochs: 150
batch_size: 24
lr: 3e-4
lr_scheduler: cosine
lr_warmup_steps: 500
lr_min: 1e-6
grad_clip: 1.0
compile: true
augment: true                      # mosaic + copy-paste + scale-jitter + hflip + photometric
num_workers: 12
prefetch_factor: 4
precision: bf16

# --- Data ---
dataset: visdrone
images: /data/omnidet_datasets/visdrone_hf/train/images
annotations: /data/omnidet_datasets/visdrone_hf/train/annotations
val_images: /data/omnidet_datasets/visdrone_hf/val/images
val_annotations: /data/omnidet_datasets/visdrone_hf/val/annotations

# --- Output ---
log_csv: logs/v0_cleanroom.csv
out: checkpoints/omnidet_v0_cleanroom.pt
